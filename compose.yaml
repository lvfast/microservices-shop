services:
  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  cart-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5433:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  product-db-data:
  cart-db-data:
  inventory-db-data:
  order-db-data:
