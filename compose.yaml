services:
  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  product-db-data:
